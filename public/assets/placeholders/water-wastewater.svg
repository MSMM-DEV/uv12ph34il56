<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2c4f73"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky-w)"/>
  <!-- Subtle cross-hatch -->
  <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="white" stroke-opacity="0.02" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#hatch)"/>
  <!-- Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#374151" fill-opacity="0.4"/>
  <!-- Main clarifier tank -->
  <ellipse cx="400" cy="310" rx="150" ry="35" fill="#4b5563" fill-opacity="0.6"/>
  <rect x="250" y="200" width="300" height="110" rx="4" fill="url(#tank)"/>
  <ellipse cx="400" cy="200" rx="150" ry="35" fill="#94a3b8"/>
  <ellipse cx="400" cy="200" rx="150" ry="35" fill="white" fill-opacity="0.1"/>
  <!-- Tank water surface -->
  <ellipse cx="400" cy="205" rx="135" ry="28" fill="#3b82f6" fill-opacity="0.25"/>
  <!-- Clarifier arm -->
  <line x1="400" y1="200" x2="530" y2="210" stroke="#e10d0d" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="400" cy="200" r="6" fill="#e10d0d" fill-opacity="0.8"/>
  <!-- Secondary tank (left) -->
  <ellipse cx="120" cy="340" rx="80" ry="20" fill="#4b5563" fill-opacity="0.5"/>
  <rect x="40" y="260" width="160" height="80" rx="3" fill="url(#tank)" fill-opacity="0.85"/>
  <ellipse cx="120" cy="260" rx="80" ry="20" fill="#94a3b8" fill-opacity="0.9"/>
  <ellipse cx="120" cy="264" rx="70" ry="15" fill="#3b82f6" fill-opacity="0.2"/>
  <!-- Secondary tank (right) -->
  <ellipse cx="680" cy="340" rx="80" ry="20" fill="#4b5563" fill-opacity="0.5"/>
  <rect x="600" y="260" width="160" height="80" rx="3" fill="url(#tank)" fill-opacity="0.85"/>
  <ellipse cx="680" cy="260" rx="80" ry="20" fill="#94a3b8" fill-opacity="0.9"/>
  <ellipse cx="680" cy="264" rx="70" ry="15" fill="#3b82f6" fill-opacity="0.2"/>
  <!-- Connecting pipes -->
  <line x1="200" y1="300" x2="250" y2="280" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <line x1="550" y1="280" x2="600" y2="300" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <!-- Flow arrows -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5">
    <path d="M215 295 L235 286" fill="none"/>
    <path d="M232 290 L235 286 L230 286" fill="none"/>
    <path d="M555 286 L575 295" fill="none"/>
    <path d="M570 291 L575 295 L575 290" fill="none"/>
  </g>
  <!-- Control building -->
  <rect x="340" y="360" width="120" height="50" rx="3" fill="#6b7280"/>
  <rect x="355" y="370" width="25" height="30" rx="2" fill="#374151"/>
  <rect x="390" y="370" width="25" height="30" rx="2" fill="#374151"/>
  <rect x="425" y="370" width="25" height="30" rx="2" fill="#374151"/>
  <!-- Capacity indicator -->
  <text x="400" y="440" text-anchor="middle" fill="white" font-family="system-ui" font-size="11" font-weight="500" opacity="0.3">1.8 MGD CAPACITY</text>
  <!-- Category label -->
  <rect x="30" y="30" width="190" height="32" rx="16" fill="#3b82f6" fill-opacity="0.8"/>
  <text x="125" y="51" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="600">WATER &amp; WASTEWATER</text>
</svg>
