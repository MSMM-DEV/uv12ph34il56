<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky-e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#1a5c3a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky-e)"/>
  <!-- Ground -->
  <path d="M0 350 Q200 320 400 340 T800 330 V500 H0Z" fill="#1b4332" fill-opacity="0.6"/>
  <!-- Trees -->
  <g fill="#2d6a4f" fill-opacity="0.7">
