<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a5080"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)"/>
  <!-- Water base -->
  <rect x="0" y="340" width="800" height="160" fill="url(#water)"/>
  <!-- Water waves -->
  <path d="M0 370 Q50 355 100 370 T200 370 T300 370 T400 370 T500 370 T600 370 T700 370 T800 370 V500 H0Z" fill="#3b82f6" fill-opacity="0.15"/>
  <path d="M0 390 Q50 380 100 390 T200 390 T300 390 T400 390 T500 390 T600 390 T700 390 T800 390 V500 H0Z" fill="#1e40af" fill-opacity="0.1"/>
  <!-- Pump station structure -->
  <rect x="180" y="180" width="440" height="200" rx="4" fill="url(#concrete)"/>
  <rect x="180" y="180" width="440" height="200" rx="4" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Roof -->
  <rect x="170" y="170" width="460" height="20" rx="3" fill="#6b7280"/>
  <!-- Pump bays -->
  <rect x="210" y="210" width="70" height="120" rx="3" fill="#374151"/>
  <rect x="300" y="210" width="70" height="120" rx="3" fill="#374151"/>
  <rect x="390" y="210" width="70" height="120" rx="3" fill="#374151"/>
  <rect x="480" y="210" width="70" height="120" rx="3" fill="#374151"/>
  <!-- Pump circles -->
  <circle cx="245" cy="270" r="22" fill="none" stroke="#e10d0d" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="335" cy="270" r="22" fill="none" stroke="#e10d0d" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="425" cy="270" r="22" fill="none" stroke="#e10d0d" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="515" cy="270" r="22" fill="none" stroke="#e10d0d" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Pump center dots -->
  <circle cx="245" cy="270" r="4" fill="#e10d0d" fill-opacity="0.6"/>
  <circle cx="335" cy="270" r="4" fill="#e10d0d" fill-opacity="0.6"/>
  <circle cx="425" cy="270" r="4" fill="#e10d0d" fill-opacity="0.6"/>
  <circle cx="515" cy="270" r="4" fill="#e10d0d" fill-opacity="0.6"/>
  <!-- Discharge pipes -->
  <rect x="230" y="330" width="30" height="60" rx="2" fill="#4b5563"/>
  <rect x="320" y="330" width="30" height="60" rx="2" fill="#4b5563"/>
  <rect x="410" y="330" width="30" height="60" rx="2" fill="#4b5563"/>
  <rect x="500" y="330" width="30" height="60" rx="2" fill="#4b5563"/>
  <!-- Levee/embankment -->
  <path d="M0 380 L180 340 L180 380 L0 380Z" fill="#4b5563" fill-opacity="0.5"/>
  <path d="M620 340 L800 380 L620 380Z" fill="#4b5563" fill-opacity="0.5"/>
  <!-- Category label -->
  <rect x="30" y="30" width="140" height="32" rx="16" fill="#e10d0d" fill-opacity="0.9"/>
  <text x="100" y="51" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="600">FLOOD CONTROL</text>
</svg>
