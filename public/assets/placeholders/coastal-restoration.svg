<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f4c75"/>
      <stop offset="60%" stop-color="#1b6ca8"/>
      <stop offset="100%" stop-color="#3b82a0"/>
    </linearGradient>
    <linearGradient id="marsh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky-c)"/>
  <!-- Subtle dot pattern -->
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.8" fill="white" fill-opacity="0.04"/>
  </pattern>
  <rect width="800" height="500" fill="url(#dots)"/>
  <!-- Distant water -->
  <rect x="0" y="240" width="800" height="260" fill="#1e6091" fill-opacity="0.3"/>
  <!-- Marsh islands -->
  <ellipse cx="200" cy="320" rx="160" ry="30" fill="url(#marsh)" fill-opacity="0.7"/>
  <ellipse cx="550" cy="300" rx="200" ry="35" fill="url(#marsh)" fill-opacity="0.8"/>
  <ellipse cx="100" cy="350" rx="120" ry="25" fill="#2d6a4f" fill-opacity="0.5"/>
  <ellipse cx="700" cy="340" rx="130" ry="28" fill="#2d6a4f" fill-opacity="0.6"/>
  <!-- Marsh grass strokes -->
  <g stroke="#40916c" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="160" y1="310" x2="155" y2="280"/>
    <line x1="170" y1="308" x2="172" y2="275"/>
    <line x1="180" y1="312" x2="176" y2="282"/>
    <line x1="220" y1="310" x2="225" y2="278"/>
    <line x1="235" y1="312" x2="230" y2="284"/>
    <line x1="480" y1="292" x2="476" y2="260"/>
    <line x1="495" y1="290" x2="498" y2="258"/>
    <line x1="510" y1="294" x2="506" y2="264"/>
    <line x1="550" y1="290" x2="555" y2="256"/>
    <line x1="570" y1="292" x2="565" y2="262"/>
    <line x1="600" y1="294" x2="604" y2="260"/>
    <line x1="620" y1="290" x2="616" y2="258"/>
  </g>
  <!-- Water ripples -->
  <path d="M0 380 Q100 370 200 380 T400 380 T600 380 T800 380 V500 H0Z" fill="#1e6091" fill-opacity="0.2"/>
  <path d="M0 410 Q80 400 160 410 T320 410 T480 410 T640 410 T800 410 V500 H0Z" fill="#155e75" fill-opacity="0.15"/>
  <path d="M0 440 Q60 432 120 440 T240 440 T360 440 T480 440 T600 440 T720 440 T800 440 V500 H0Z" fill="#164e63" fill-opacity="0.2"/>
  <!-- Bird silhouettes -->
  <g fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <path d="M300 140 Q310 130 320 138"/>
    <path d="M340 120 Q350 108 360 118"/>
    <path d="M380 130 Q388 122 396 128"/>
  </g>
  <!-- Sun/moon glow -->
  <circle cx="650" cy="100" r="45" fill="white" fill-opacity="0.08"/>
  <circle cx="650" cy="100" r="25" fill="white" fill-opacity="0.12"/>
  <!-- Category label -->
  <rect x="30" y="30" width="190" height="32" rx="16" fill="#2d6a4f" fill-opacity="0.9"/>
  <text x="125" y="51" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="600">COASTAL RESTORATION</text>
</svg>
