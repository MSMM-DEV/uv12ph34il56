<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-d)"/>
  <pattern id="bp" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="500" fill="url(#bp)"/>
  <!-- Blueprint-style engineering drawing -->
  <g stroke="white" stroke-opacity="0.12" stroke-width="1">
    <!-- Grid cross marks -->
    <line x1="200" y1="245" x2="200" y2="255"/>
    <line x1="195" y1="250" x2="205" y2="250"/>
    <line x1="400" y1="245" x2="400" y2="255"/>
    <line x1="395" y1="250" x2="405" y2="250"/>
    <line x1="600" y1="245" x2="600" y2="255"/>
    <line x1="595" y1="250" x2="605" y2="250"/>
  </g>
  <!-- Central structure outline -->
  <rect x="250" y="170" width="300" height="180" rx="2" stroke="white" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6 3"/>
  <!-- Dimension lines -->
  <g stroke="white" stroke-opacity="0.1" stroke-width="0.75">
    <line x1="250" y1="370" x2="550" y2="370"/>
    <line x1="250" y1="365" x2="250" y2="375"/>
    <line x1="550" y1="365" x2="550" y2="375"/>
    <line x1="230" y1="170" x2="230" y2="350"/>
    <line x1="225" y1="170" x2="235" y2="170"/>
    <line x1="225" y1="350" x2="235" y2="350"/>
  </g>
  <!-- MSMM mark -->
  <text x="400" y="260" text-anchor="middle" fill="white" font-family="system-ui" font-size="28" font-weight="700" opacity="0.08">MSMM</text>
  <!-- Engineering compass -->
  <circle cx="400" cy="250" r="60" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="400" cy="250" r="40" stroke="white" stroke-opacity="0.06" stroke-width="0.75"/>
  <line x1="400" y1="185" x2="400" y2="315" stroke="white" stroke-opacity="0.06" stroke-width="0.75"/>
  <line x1="335" y1="250" x2="465" y2="250" stroke="white" stroke-opacity="0.06" stroke-width="0.75"/>
  <!-- Red accent -->
  <circle cx="400" cy="250" r="4" fill="#e10d0d" fill-opacity="0.4"/>
  <!-- Category label -->
  <rect x="30" y="30" width="150" height="32" rx="16" fill="#e10d0d" fill-opacity="0.9"/>
  <text x="105" y="51" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="600">ENGINEERING</text>
</svg>
